}
</script>
<script>
var STAT = ["Waiting on me","Waiting on them","No reply","Closed"];
var LBL = {"Waiting on me":"Waiting on me (they replied last)","Waiting on them":"Waiting on them","No reply":"No reply yet","Closed":"Closed / rented"};
document.getElementById("fl").innerHTML = STAT.map(function(s){ return "<label><input type=\"checkbox\" checked onchange=\"toggle(this,'"+s+"')\"><span class=\"sw\" style=\"background:"+col(s)+"\"></span>"+LBL[s]+" ("+DATA.filter(function(d){return statusKey(d.st)===s;}).length+")</label>"; }).join("") + "<label class=\"favf\"><input type=\"checkbox\" onchange=\"favOnly=this.checked;drawMarkers();paintList();\"><span class=\"sw\" style=\"background:#ffb400\"></span>Favourites only (<span id=\"fc\">0</span>)</label>";
document.getElementById("legend").innerHTML = STAT.map(function(s){ return "<div><span class=\"sw\" style=\"background:"+col(s)+"\"></span>"+LBL[s]+"</div>"; }).join("") + "<div><span class=\"sw\" style=\"background:#ffb400\"></span>★ Favourite</div>";
function toggle(cb,s){ filters[s]=cb.checked; drawMarkers(); paintList(); }
document.getElementById("rs").oninput = function(){ maxRent = +this.value; document.getElementById("rv").textContent = fmt(maxRent); drawMarkers(); paintList(); };
var drag=null;
mapEl.addEventListener("mousedown", function(e){ if(e.target && e.target.closest && e.target.closest("#card,#lb,#zoom,#legend")) return; drag={x:e.clientX,y:e.clientY,ox:originX,oy:originY,moved:false}; mapEl.classList.add("drag"); });
window.addEventListener("mousemove", function(e){ if(!drag) return; originX = drag.ox-(e.clientX-drag.x); originY = drag.oy-(e.clientY-drag.y); if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3) drag.moved=true; setTransform(); });
window.addEventListener("mouseup", function(){ if(!drag) return; var moved=drag.moved; drag=null; mapEl.classList.remove("drag"); if(moved) drawTiles(); });
function zoomTo(nz, cx, cy){ nz=Math.max(9,Math.min(17,nz)); if(nz===z) return; var w=mapEl.clientWidth,h=mapEl.clientHeight; cx=(cx==null?w/2:cx); cy=(cy==null?h/2:cy); var g=unproj(originX+cx, originY+cy, z); z=nz; var p=proj(g.lat,g.lng,z); originX=p.x-cx; originY=p.y-cy; tilesEl.innerHTML=""; setTransform(); drawTiles(); drawMarkers(); }
document.getElementById("zi").onclick=function(){ zoomTo(z+1); };
document.getElementById("zo").onclick=function(){ zoomTo(z-1); };
mapEl.addEventListener("wheel", function(e){ if(e.target && e.target.closest && e.target.closest("#card,#lb,#zoom,#legend")) return; e.preventDefault(); var r=mapEl.getBoundingClientRect(); zoomTo(z + (e.deltaY<0?1:-1), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
mapEl.addEventListener("dblclick", function(e){ if(e.target && e.target.closest && e.target.closest("#card,#lb,#zoom,#legend")) return; var r=mapEl.getBoundingClientRect(); zoomTo(z+1, e.clientX-r.left, e.clientY-r.top); });
function init(){
  var pts = DATA.filter(function(d){ return d.lat!==null; });
  var lats = pts.map(function(d){return d.lat;}), lngs = pts.map(function(d){return d.lng;});
  var minLat=Math.min.apply(null,lats), maxLat=Math.max.apply(null,lats), minLng=Math.min.apply(null,lngs), maxLng=Math.max.apply(null,lngs);
  var cLat=(minLat+maxLat)/2, cLng=(minLng+maxLng)/2, w=mapEl.clientWidth, h=mapEl.clientHeight;
  for(var t=15;t>=9;t--){ var a=proj(minLat,minLng,t), b=proj(maxLat,maxLng,t); if(Math.abs(b.x-a.x)<w-90 && Math.abs(b.y-a.y)<h-90){ z=t; break; } }
  var p=proj(cLat,cLng,z); originX=p.x-w/2; originY=p.y-h/2; setTransform(); drawTiles(); drawMarkers(); paintList();
  var nc = DATA.filter(function(d){ return d.lat===null; });
  document.getElementById("nocoord").innerHTML = nc.length ? ("Not on the map (listing page removed, no coordinates): "+nc.map(function(d){ return esc(d.a)+" ("+esc(d.c)+", "+fmt(d.tot)+" SEK)"; }).join(", ")) : "";
}
window.addEventListener("resize", function(){ drawTiles(); });
mapEl.addEventListener("click", function(e){ if(e.target===mapEl||e.target.tagName==="IMG"){ } });
init();
</script></body></html>
